<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCC Reset Password</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <a href="index.html" class="logo">SCC</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="players.html">Players</a>
            <a href="matches.html">Matches</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <main class="admin-page">

        <div class="admin-login">

            <p class="section-tag">
                SULTANPUR CRICKET CLUB
            </p>

            <h1>RESET PASSWORD</h1>

            <p>Create a new admin password.</p>


            <form id="resetForm">

                <label for="password">
                    NEW PASSWORD
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter new password"
                    required
                    minlength="6"
                >


                <label for="confirmPassword">
                    CONFIRM PASSWORD
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required
                    minlength="6"
                >


                <button type="submit">
                    UPDATE PASSWORD
                </button>


                <p id="resetMessage"></p>

            </form>

        </div>

    </main>


    <footer>

        <h2>SULTANPUR CRICKET CLUB</h2>

        <p>Born in 2026 • Sultanpur, Howrah</p>

        <p class="copyright">
            © 2026 Sultanpur Cricket Club. All Rights Reserved.
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <script>

        const resetForm =
            document.getElementById("resetForm");

        const resetMessage =
            document.getElementById("resetMessage");


        resetForm.addEventListener("submit", async function(event) {

            event.preventDefault();


            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            if (password !== confirmPassword) {

                resetMessage.textContent =
                    "Passwords do not match.";

                resetMessage.style.color = "#ff5c5c";

                return;
            }


            resetMessage.textContent =
                "Updating password...";


            const { error } =
                await sccSupabase.auth.updateUser({
                    password: password
                });


            if (error) {

                resetMessage.textContent =
                    "Password update failed.";

                resetMessage.style.color = "#ff5c5c";

                return;
            }


            resetMessage.textContent =
                "Password updated successfully!";

            resetMessage.style.color = "#00d9ff";


            setTimeout(function() {

                window.location.href = "admin.html";

            }, 1500);

        });

    </script>

</body>

</html>
